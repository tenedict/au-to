# XcodeGen 정의 — `.xcodeproj` 는 생성물이다. 프로젝트 설정은 **여기서만** 고친다.
#
# entitlements 는 `properties` 에 적는다. `path` 만 적으면 XcodeGen 이 그 파일을
# 빈 <dict/> 로 덮어쓴다 — App Group 을 파일에 직접 써 넣으면 다음 `xcodegen generate`
# 에서 조용히 사라지고, 공유 시트로 담은 스크린샷이 앱에 도착하지 않는다.
name: CaptureTask
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
# Xcode 빌드 설정 우선순위: 타깃 설정 > 타깃 xcconfig > **프로젝트 설정** > 프로젝트 xcconfig
#
# 그래서 Secrets.xcconfig(타깃 xcconfig)가 이기려면 기본값이 **프로젝트 수준**에 있어야 한다.
# 타깃의 settings.base 에 두면 xcconfig 가 조용히 무시된다 — 빌드는 성공하고
# 앱만 로컬 주소를 계속 바라본다. 실제로 한 번 그렇게 배포했다.
settings:
  base:
    SWIFT_VERSION: "5.0"
    # config/apple/Secrets.xcconfig 가 있으면 그쪽 값이 이긴다.
    CAPTURETASK_API_BASE_URL: "http://127.0.0.1:8787"
    CAPTURETASK_CLIENT_KEY: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  CaptureTask:
    type: application
    platform: iOS
    # 화면은 apps/ios, 계산과 저장은 core/swift. Share 는 별도 타깃이라 여기 넣지 않는다.
    sources:
      - apps/ios/App
      - apps/ios/Views
      - apps/ios/Resources
      - core/swift
    info:
      path: apps/ios/App/Info.plist
      properties:
        CFBundleDisplayName: CaptureTask
        UILaunchScreen: {}
        # 한국어 전용 앱이다. 이 선언이 없으면 영어 기기에서 Locale.current 가 en_US 가 되고,
        # 화면의 날짜가 "Jul 30, 2026" 으로 나온다 — 나머지 문구는 전부 한국어인 채로.
        # 백엔드로 보내는 locale 값도 함께 틀어져 날짜 해석이 어긋난다.
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CAPTURETASK_API_BASE_URL: "$(CAPTURETASK_API_BASE_URL)"
        CAPTURETASK_CLIENT_KEY: "$(CAPTURETASK_CLIENT_KEY)"
        NSAppTransportSecurity:
          # 로컬 백엔드(http://127.0.0.1)를 개발 중에 부르기 위한 예외입니다.
          # 배포한 서버는 HTTPS 라 이 설정과 무관합니다.
          NSAllowsLocalNetworking: true
        NSCalendarsFullAccessUsageDescription: "확인한 할 일을 Apple 캘린더에 추가하기 위해 캘린더 접근이 필요해요."
        NSCalendarsWriteOnlyAccessUsageDescription: "확인한 할 일을 Apple 캘린더에 추가하기 위해 캘린더 쓰기 접근이 필요해요."
    entitlements:
      path: config/apple/CaptureTask.entitlements
      properties:
        # SharedInbox.appGroupIdentifier 와 반드시 같아야 한다 (프로젝트 규칙 1 이 대조한다).
        com.apple.security.application-groups:
          - group.com.example.capturetask
    # 실제 값은 config/apple/Secrets.xcconfig 에 있고 그 파일은 커밋되지 않습니다.
    # 없으면 아래 base 의 기본값(로컬 백엔드)이 그대로 쓰입니다.
    configFiles:
      Debug: config/apple/Secrets.xcconfig
      Release: config/apple/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.capturetask
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: CaptureTaskShare
        embed: true
  CaptureTaskShare:
    type: app-extension
    platform: iOS
    # 확장이 등록까지 끝낸다 (ADR-2 재검토). 그래서 앱과 같은 코드를 쓴다.
    sources:
      - apps/ios/Share
      - core/swift
    info:
      path: apps/ios/Share/Info.plist
      properties:
        CFBundleDisplayName: "CaptureTask에 담기"
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
    entitlements:
      path: config/apple/CaptureTaskShare.entitlements
      properties:
        # 한쪽만 바꾸면 담기는 성공하고 도착이 실패한다.
        com.apple.security.application-groups:
          - group.com.example.capturetask
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.capturetask.share
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: "CaptureTask에 담기"
  # ── macOS ────────────────────────────────────────────────
  # core/swift 를 iOS 와 그대로 공유한다.
  # apps/macos/Views 는 공유하지 않는다 — 화면은 플랫폼마다 다른 것이 맞다.
  CaptureTaskMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - apps/macos/App
      - apps/macos/Views
      - apps/macos/Windows
      - apps/macos/Resources
      - core/swift
    info:
      path: apps/macos/App/Info.plist
      properties:
        CFBundleDisplayName: CaptureTask
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CAPTURETASK_API_BASE_URL: "$(CAPTURETASK_API_BASE_URL)"
        CAPTURETASK_CLIENT_KEY: "$(CAPTURETASK_CLIENT_KEY)"
        NSCalendarsFullAccessUsageDescription: "확인한 할 일을 Apple 캘린더에 추가하기 위해 캘린더 접근이 필요해요."
        NSCalendarsWriteOnlyAccessUsageDescription: "확인한 할 일을 Apple 캘린더에 추가하기 위해 캘린더 쓰기 접근이 필요해요."
        # 물방울만 띄우고 Dock 아이콘은 두지 않는다. 메뉴바에서 켜고 끈다.
        LSUIElement: true
        # 이미지를 받는 앱으로 등록한다. 이걸 넣으면 세 가지가 한 번에 열린다.
        #   · 파인더 "다른 앱으로 열기 → CaptureTask"
        #   · 이미지를 앱 아이콘에 끌어다 놓기
        #   · open -a CaptureTask <파일>
        CFBundleDocumentTypes:
          - CFBundleTypeName: 이미지
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: config/apple/CaptureTaskMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # 백엔드를 부른다.
        com.apple.security.network.client: true
        # 사용자가 끌어다 놓거나 고른 파일만 읽는다.
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.personal-information.calendars: true
    configFiles:
      Debug: config/apple/Secrets.xcconfig
      Release: config/apple/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.capturetask.mac
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: CaptureTaskMacShare
        embed: true

  # macOS 공유 확장. 파일 URL 만 받아 메인 앱을 열어 준다 — App Group 이 필요 없다.
  CaptureTaskMacShare:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - apps/macos/Share
    info:
      path: apps/macos/Share/Info.plist
      properties:
        CFBundleDisplayName: "CaptureTask에 담기"
        CFBundleDevelopmentRegion: ko
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).MacShareViewController"
    entitlements:
      path: config/apple/CaptureTaskMacShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.capturetask.mac.share
        SKIP_INSTALL: YES

  CaptureTaskTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - tests/swift
    dependencies:
      - target: CaptureTask
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.capturetask.tests
schemes:
  CaptureTaskMac:
    build:
      targets:
        CaptureTaskMac: all
    run:
      config: Debug
  CaptureTask:
    build:
      targets:
        CaptureTask: all
        CaptureTaskTests: [test]
    test:
      targets:
        - CaptureTaskTests
