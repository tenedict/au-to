next_sprint:
  id: sprint-4
  name: 평가셋 넓히기
  goal: 15건을 50건으로. 실행 간 편차보다 개선폭이 커야 판단할 수 있다
  status: not_started
  estimate_days: 2
  planned_stories: [S-2.3]
  why: |
    평가셋 15건으로 첫 측정을 했다. 같은 프롬프트로 세 번 돌리니
    87% · 87% · 73% 로 편차가 개선폭보다 컸다.
    일관되게 실패하는 두 건(할 일이 아닌 것에 마감이 붙음, 지난 날짜를 조용히 추정)은
    진짜 결함이라 확인됐지만, 고친 뒤 좋아졌는지 재려면 케이스가 더 필요하다.

